name: KOBIS 일별 박스오피스 수집

on:
  schedule:
    - cron: "10 0 * * *"     # 매일 00:10 UTC = 09:10 KST (전날 확정치)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kobis-boxoffice
  cancel-in-progress: false

jobs:
  boxoffice:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 일별 박스오피스 수집 + 대시보드 갱신
        run: python kobis_boxoffice_daily.py
      - name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add greenland2_boxoffice.csv boxoffice_competitors.csv index.html
          if git diff --quiet --cached; then
            echo "변경 없음"
          else
            git commit -m "boxoffice update (cloud) $(date '+%Y-%m-%d')"
            git pull --rebase --autostash origin main || true
            git push
          fi
